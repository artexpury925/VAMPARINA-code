<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VAMPARINA V1 - EMPIRE LINKER</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
  <style>
    :root {
      --primary-color: #000000;
      --secondary-color: #ffffff;
      --glow-color: #00ff00;
      --success-glow: #00ff00;
      --error-glow: #ff0000;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Arial', sans-serif;
      background: #000;
      color: #0f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      position: relative;
    }
    #background-video {
      position: fixed;
      top: 0; left: 0;
      min-width: 100%; min-height: 100%;
      z-index: -1;
      object-fit: cover;
    }
    .container {
      width: 100%;
      max-width: 450px;
      background: rgba(0, 0, 0, 0.85);
      border: 3px solid var(--glow-color);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 0 40px var(--glow-color);
      text-align: center;
      animation: pulse 3s infinite;
      margin-bottom: 20px;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 40px var(--glow-color); }
      50% { box-shadow: 0 0 60px var(--glow-color); }
    }
    .logo {
      width: 100px; height: 100px;
      background: #0f0;
      color: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      margin: 0 auto 20px;
      animation: float 4s infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    h1 {
      font-size: 40px;
      text-shadow: 0 0 20px var(--glow-color);
      margin-bottom: 10px;
    }
    .subtitle {
      font-size: 18px;
      margin-bottom: 30px;
      opacity: 0.9;
    }
    .toggle-container {
      display: flex;
      background: #111;
      border-radius: 15px;
      padding: 8px;
      margin-bottom: 25px;
      border: 2px solid var(--glow-color);
    }
    .toggle-option {
      flex: 1;
      padding: 15px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.4s;
    }
    .toggle-option.active {
      background: var(--glow-color);
      color: #000;
      box-shadow: 0 0 20px var(--glow-color);
    }
    .input-group {
      margin-bottom: 20px;
    }
    .input-field {
      width: 100%;
      padding: 18px;
      border: 3px solid var(--glow-color);
      border-radius: 15px;
      background: #000;
      color: #0f0;
      font-size: 20px;
      text-align: center;
    }
    .generate-btn {
      width: 100%;
      padding: 18px;
      background: var(--glow-color);
      color: #000;
      border: none;
      border-radius: 15px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      margin: 20px 0;
      transition: all 0.4s;
    }
    .generate-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px var(--glow-color);
    }
    .copy-btn {
      width: 100%;
      padding: 15px;
      background: #111;
      border: 3px solid var(--glow-color);
      border-radius: 15px;
      color: #0f0;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      display: none;
      transition: all 0.4s;
    }
    .copy-btn:hover {
      background: var(--glow-color);
      color: #000;
      box-shadow: 0 0 20px var(--glow-color);
    }
    .code-display, .result-display {
      background: #111;
      padding: 20px;
      border-radius: 15px;
      font-size: 32px;
      font-weight: bold;
      min-height: 80px;
      margin: 20px 0;
      border: 2px solid var(--glow-color);
      word-break: break-all;
    }
    .qr-display {
      display: none;
      margin: 20px 0;
    }
    .qr-image {
      max-width: 300px;
      border: 10px solid var(--glow-color);
      border-radius: 20px;
      box-shadow: 0 0 40px var(--glow-color);
    }
    .loading {
      display: none;
      font-size: 50px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .success-message {
      color: var(--success-glow);
      font-size: 24px;
      animation: success 1s;
    }
    @keyframes success {
      0% { opacity: 0; transform: scale(0.5); }
      100% { opacity: 1; transform: scale(1); }
    }
    .footer {
      margin-top: 30px;
      font-size: 16px;
      opacity: 0.8;
    }
    #particles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
    }
    .particle {
      position: absolute;
      background: var(--glow-color);
      border-radius: 50%;
      opacity: 0.6;
      animation: rise 10s linear infinite;
    }
    @keyframes rise {
      0% { transform: translateY(100vh); }
      100% { transform: translateY(-100vh); }
    }
    @media (max-width: 480px) {
      .container { padding: 20px; max-width: 90%; }
      h1 { font-size: 32px; }
      .code-display { font-size: 24px; }
      .qr-image { max-width: 250px; }
    }
  </style>
</head>
<body>
  <video id="background-video" autoplay loop muted playsinline>
    <source src="anime-loop.mp4" type="video/mp4">
  </video>

  <div id="particles"></div>

  <div class="container">
    <div class="logo"><i class="fas fa-crown"></i></div>
    <h1>VAMPARINA V1</h1>
    <p class="subtitle">KING ARNOLD EMPIRE LINKER 2025</p>

    <div class="toggle-container">
      <div class="toggle-option active" data-mode="pair">PAIR CODE</div>
      <div class="toggle-option" data-mode="qr">QR CODE</div>
    </div>

    <div class="input-group" id="inputGroup">
      <input type="text" id="mobileNumber" class="input-field" placeholder="254703110780">
    </div>

    <button class="generate-btn" id="submit">GENERATE PAIR CODE</button>

    <div class="loading" id="loading">LOADING...</div>

    <div class="code-display" id="codeDisplay">Your code will appear here</div>
    <button class="copy-btn" id="copyBtn">COPY CODE</button>

    <div class="qr-display" id="qrDisplay">
      <img id="qrImage" class="qr-image" src="" alt="QR Code">
      <p>Scan with WhatsApp → Linked Devices</p>
    </div>

    <div class="result-display" id="resultDisplay" style="display:none;"></div>

    <div class="footer">
      <p>© 2025 KING ARNOLD CHIRCHIR • +254703110780</p>
      <p>EVERY SCAN = 1 NEW SOLDIER IN YOUR EMPIRE</p>
    </div>
  </div>

  <audio id="phonkPlayer" preload="none" loop>
    <source src="https://www.free-stock-music.com/music/fsm-team/drift-phonk.mp3" type="audio/mpeg">
  </audio>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>
  <script>
    const phonkPlayer = document.getElementById('phonkPlayer');
    phonkPlayer.play().catch(() => {});

    // Particles
    for(let i = 0; i < 60; i++) {
      const p = document.createElement('div');
      p.classList.add('particle');
      p.style.width = p.style.height = Math.random() * 6 + 2 + 'px';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDuration = Math.random() * 8 + 8 + 's';
      p.style.animationDelay = Math.random() * 5 + 's';
      document.getElementById('particles').appendChild(p);
    }

    let currentMode = 'pair';

    document.querySelectorAll('.toggle-option').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.toggle-option').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.mode;

        document.getElementById('inputGroup').style.display = currentMode === 'pair' ? 'block' : 'none';
        document.getElementById('submit').style.display = currentMode === 'pair' ? 'block' : 'none';
        document.getElementById('codeDisplay').style.display = 'block';
        document.getElementById('copyBtn').style.display = 'none';
        document.getElementById('qrDisplay').style.display = 'none';
        document.getElementById('resultDisplay').style.display = 'none';
        document.getElementById('mobileNumber').value = '';

        if (currentMode === 'qr') generateQR();
      });
    });

    document.getElementById('submit').addEventListener('click', async () => {
      const num = document.getElementById('mobileNumber').value.replace(/\D/g, '');
      if (!num || num.length < 9) {
        document.getElementById('codeDisplay').innerHTML = 'INVALID NUMBER';
        return;
      }

      document.getElementById('loading').style.display = 'block';
      document.getElementById('codeDisplay').innerHTML = 'Generating...';
      document.getElementById('copyBtn').style.display = 'none';

      try {
        const res = await axios.get(`/pair?number=${num}`);
        if (res.data.includes('SESSION CREATED')) {
          document.getElementById('resultDisplay').innerHTML = `<div class="success-message">SESSION CREATED<br>YOUR SOLDIER IS READY</div>`;
          document.getElementById('resultDisplay').style.display = 'block';
          document.getElementById('codeDisplay').style.display = 'none';
        } else if (res.data.code) {
          const code = res.data.code;
          document.getElementById('codeDisplay').innerHTML = code;
          document.getElementById('copyBtn').style.display = 'block';
        } else {
          document.getElementById('codeDisplay').innerHTML = 'ERROR - TRY AGAIN';
        }
      } catch (err) {
        document.getElementById('codeDisplay').innerHTML = 'FAILED - TRY AGAIN';
        console.error('Pair error:', err);
      }
      document.getElementById('loading').style.display = 'none';
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
      const code = document.getElementById('codeDisplay').innerText;
      navigator.clipboard.writeText(code).then(() => {
        const copyBtn = document.getElementById('copyBtn');
        copyBtn.innerHTML = 'COPIED!';
        setTimeout(() => {
          copyBtn.innerHTML = 'COPY CODE';
        }, 2000);
      }).catch(err => console.error('Copy failed:', err));
    });

    async function generateQR() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('qrDisplay').style.display = 'none';
      document.getElementById('codeDisplay').style.display = 'none';
      document.getElementById('copyBtn').style.display = 'none';

      try {
        const res = await axios.get('/qr');
        if (res.data.includes('SUCCESS')) {
          document.getElementById('resultDisplay').innerHTML = `<div class="success-message">SCAN SUCCESSFUL<br>YOUR NEW SOLDIER IS IN THE EMPIRE</div>`;
          document.getElementById('resultDisplay').style.display = 'block';
        } else {
          const qrSrc = res.data.match(/src="([^"]+)"/)?.[1] || '';
          if (qrSrc) {
            document.getElementById('qrImage').src = qrSrc;
            document.getElementById('qrDisplay').style.display = 'block';
          } else {
            document.getElementById('codeDisplay').innerHTML = 'QR FAILED';
            document.getElementById('codeDisplay').style.display = 'block';
          }
        }
      } catch {
        document.getElementById('codeDisplay').innerHTML = 'QR FAILED';
        document.getElementById('codeDisplay').style.display = 'block';
      }
      document.getElementById('loading').style.display = 'none';
    }
  </script>
</body>
</html>
